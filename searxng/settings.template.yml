# SearXNG for Sthanik: a private metasearch on this machine only (127.0.0.1). Sthanik does not use it yet.
# searxng.sh copies this to config/settings.yml and fills in a random secret.
use_default_settings: true

general:
  instance_name: "Sthanik search"

search:
  safe_search: 0          # each request overrides it: safesearch=0 (off), 1 (moderate), 2 (strict)
  autocomplete: ""
  formats: [html, json]   # json is off by default and is what the app would call

server:
  secret_key: "__SECRET__"
  bind_address: "0.0.0.0" # inside the container; searxng.sh publishes it on 127.0.0.1 only
  port: 8080
  limiter: false          # a bot limiter makes no sense for a single local user
  image_proxy: false
  public_instance: false

outgoing:
  request_timeout: 5.0
  max_request_timeout: 9.0

engines:
  # general web
  - {name: bing, disabled: false}
  - {name: google, disabled: false}
  - {name: duckduckgo, disabled: false}
  - {name: brave, disabled: false}
  - {name: startpage, disabled: false}
  - {name: mojeek, disabled: false}
  - {name: qwant, disabled: false}
  - {name: yahoo, disabled: false}
  - {name: wikipedia, disabled: false}
  # news
  - {name: bing news, disabled: false}
  - {name: duckduckgo news, disabled: false}
  - {name: google news, disabled: false}
  # images
  - {name: bing images, disabled: false}
  - {name: duckduckgo images, disabled: false}
  - {name: google images, disabled: false}
  - {name: brave.images, disabled: false}
  - {name: qwant images, disabled: false}
