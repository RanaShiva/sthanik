name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Python compiles
        run: python -m compileall -q app
      - name: Interface scripts parse
        run: |
          for f in app/static/js/*.js app/static/js/pages/*.js; do
            node --input-type=module --check < "$f" || { echo "syntax error in $f"; exit 1; }
          done
      - name: Document harness tests
        run: python -I tests/test_document_harness.py
      - name: Setup, hardware and project tests
        run: python -I tests/test_setup.py
      - name: Self-test (server starts, pages load, documents are made, hardware is read)
        run: python app/launcher.py --selftest
